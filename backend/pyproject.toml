[project]
name = "deal-rescue-backend"
version = "0.1.0"
description = "Deal Rescue AI backend (FastAPI + Hindsight memory)"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.3",
    "anthropic>=1.8.0",
    "fastapi>=0.141.1",
    "hindsight-client==0.10.1",
    "pydantic-settings>=2.15.0",
    "sqlmodel>=0.0.47",
    "tzdata>=2026.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live: requires a running Hindsight service (set HINDSIGHT_LIVE=1)"]
